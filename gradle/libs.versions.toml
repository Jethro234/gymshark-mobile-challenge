[versions]
# Build tooling.
#
# AGP is latest stable. An earlier attempt pinned AGP to the pre-9.0 line
# (8.13.x) to keep Paparazzi's Gradle plugin working — Paparazzi accesses
# AGP's BaseExtension, which AGP 9 removed (cashapp/paparazzi#2095,
# unresolved at the time this catalog was written), and Paparazzi's only
# AGP-9-aware release (2.0.0-alphaXX) requires JDK 21, which this machine
# doesn't have wired as a build JDK. That path was abandoned when it
# collided with a harder constraint: Hilt's Gradle plugin (2.60.1) hard-
# requires AGP ≥ 9.0.0 and refuses to apply on 8.13. Hilt is used
# everywhere in this app; Paparazzi is one test layer. docs/SCOPE.md §6
# pre-authorises exactly this trade — "if unresolved in 45 minutes, drop
# snapshot testing and say so" — so Paparazzi is absent from this catalog
# rather than AGP being held back. See the commit that introduced this
# comment for the full chain of evidence.
#
# Kotlin is pinned to 2.3.20, one patch behind the true latest (2.3.21),
# because that is the exact version KSP's latest release (2.3.11) is built
# and tested against (confirmed via ksp's own gradle.properties at that
# tag: kotlinBaseVersion=2.3.20) — KSP's version number does not track
# Kotlin's 1:1 despite the superficial resemblance.
agp = "9.3.1"
kotlin = "2.3.20"
ksp = "2.3.11"

# AndroidX / Jetpack.
core-ktx = "1.19.0"
lifecycle = "2.11.0"
activity-compose = "1.13.0"
composeBom = "2026.06.01"
navigation3 = "1.1.5"
lifecycle-viewmodel-navigation3 = "2.11.0"

# DI.
hilt = "2.60.1"
hilt-navigation-compose = "1.4.0"

# Network.
retrofit = "3.0.0"
okhttp = "5.4.0"
kotlinx-serialization = "1.11.0"
kotlinx-serialization-converter = "1.0.0"

# Images.
coil = "3.5.0"

# Async / collections.
kotlinx-coroutines = "1.11.0"
kotlinx-collections-immutable = "0.5.1"

# Unit test.
# junit5 stays at 5.13.2 rather than the newer Jupiter 6.x line: the
# Mannodermaus plugin's own 2.0.1 release notes name 5.13.2 as the version
# it was verified against, and Jupiter 6.x compatibility with that plugin
# is unconfirmed.
junit5 = "5.13.2"
mannodermaus-junit5-plugin = "2.0.1"
turbine = "1.2.1"
mockwebserver = "5.4.0"

# Instrumented.
androidx-test-junit = "1.3.0"

# Perf.
androidx-benchmark = "1.4.1"
androidx-baselineprofile = "1.4.1"
profileinstaller = "1.4.1"

# Quality.
ktlint-gradle = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-text = { module = "androidx.compose.ui:ui-text" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle-viewmodel-navigation3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "kotlinx-serialization-converter" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit5", version.ref = "mockwebserver" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }

junit5-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit5-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# No Espresso: docs/ARCHITECTURE.md §9.3 uses Compose's own testing API for
# the two instrumented tests, not raw Espresso.
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

# build-logic classpath only — the convention plugins in build-logic apply
# these by id, so build-logic itself needs the implementation jars.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint-gradle" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
mannodermaus-gradlePlugin = { group = "de.mannodermaus.gradle.plugins", name = "android-junit5", version.ref = "mannodermaus-junit5-plugin" }
kover-gradlePlugin = { group = "org.jetbrains.kotlinx", name = "kover-gradle-plugin", version.ref = "kover" }
baselineprofile-gradlePlugin = { group = "androidx.baselineprofile", name = "androidx.baselineprofile.gradle.plugin", version.ref = "androidx-baselineprofile" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
mannodermaus-android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "mannodermaus-junit5-plugin" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-baselineprofile" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
