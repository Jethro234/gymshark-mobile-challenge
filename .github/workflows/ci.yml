name: CI

on:
  push:
    branches: [main]
  pull_request:

# docs/CONVENTIONS.md §5 — ktlint → detekt → lint → unit tests (JVM) → assembleRelease.
# No secrets: the release buildType is signed with the debug key (see app/build.gradle.kts)
# specifically so this pipeline needs no keystore. No Macrobenchmark: GitHub Actions has no
# physical devices and emulator figures are too noisy to gate on (docs/PERFORMANCE.md).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble release
        run: ./gradlew assembleRelease
